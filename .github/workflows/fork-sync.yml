name: Fork sync (main)
# Integrate both sources on top of validated fork history, for review only.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM: code-yeongyu/oh-my-openagent
  PR_NUMBER: '9016'
  BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip pending sync review
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --base "$BRANCH" --limit 1000 --json headRefName --jq 'map(select(.headRefName | startswith("fork-sync/"))) | length')
          echo "count=$pending" >> "$GITHUB_OUTPUT"

      - name: Fetch sources
        id: sources
        if: steps.pending.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GIT_MASTER=1 git config user.name "fork-sync"
          GIT_MASTER=1 git config user.email "fork-sync@users.noreply.github.com"
          GIT_MASTER=1 git remote add upstream "https://github.com/${UPSTREAM}.git"
          GIT_MASTER=1 git fetch --no-tags origin "$BRANCH"
          GIT_MASTER=1 git fetch --no-tags upstream dev
          state=$(gh pr view "$PR_NUMBER" -R "$UPSTREAM" --json state -q .state)
          if [ "$state" = "OPEN" ]; then
            GIT_MASTER=1 git fetch --no-tags upstream "pull/${PR_NUMBER}/head:refs/remotes/upstream/pr"
          fi
          echo "pr_state=$state" >> "$GITHUB_OUTPUT"

      - name: Integrate sources
        id: integrate
        if: steps.pending.outputs.count == '0'
        env:
          PR_STATE: ${{ steps.sources.outputs.pr_state }}
        run: |
          GIT_MASTER=1 git checkout -q -b candidate "origin/${BRANCH}"
          sources=(upstream/dev)
          if [ "$PR_STATE" = "OPEN" ]; then sources+=(upstream/pr); fi
          for source in "${sources[@]}"; do
            if GIT_MASTER=1 git merge-base --is-ancestor "$source" HEAD; then continue; fi
            if ! GIT_MASTER=1 git merge --no-ff --no-edit "$source"; then
              GIT_MASTER=1 git merge --abort
              echo "conflict=$source" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # Never enable upstream CI, publish, deploy or scheduled workflows here.
          find .github/workflows -type f ! -name 'fork-sync.yml' ! -name 'fork-release.yml' -print0 | xargs -0 -r env GIT_MASTER=1 git rm -q
          GIT_MASTER=1 git diff --cached --quiet || GIT_MASTER=1 git commit -q -m "ci(fork): drop upstream workflows from the fork branch"
          if [ "$(GIT_MASTER=1 git rev-parse HEAD)" = "$(GIT_MASTER=1 git rev-parse "origin/${BRANCH}")" ]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.pending.outputs.count == '0' && steps.integrate.outputs.conflict == '' && steps.integrate.outputs.unchanged != 'true'
        with:
          bun-version: '1.4.4'

      - name: Test the candidate
        id: test
        if: steps.pending.outputs.count == '0' && steps.integrate.outputs.conflict == '' && steps.integrate.outputs.unchanged != 'true'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun test script/fork-sync.test.ts packages/omo-opencode/src/v2 packages/omo-config-core/src/loader

      - name: Propose integration
        id: propose
        if: steps.test.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="fork-sync/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          GIT_MASTER=1 git push origin "HEAD:refs/heads/$head"
          gh pr create -R "$GITHUB_REPOSITORY" --base "$BRANCH" --head "$head" --title "fork-sync: integrate upstream and V2 updates" --body "Integrates upstream dev and open PR #${PR_NUMBER} onto validated fork history. V2 and sync fixture tests passed. Review and merge without replacing main history."

      - name: Report failure
        id: report
        if: failure() || steps.integrate.outputs.conflict != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT: ${{ steps.integrate.outputs.conflict }}
        run: |
          title="fork-sync: main needs attention"
          if [ -n "$CONFLICT" ]; then reason="Merge conflict on: $CONFLICT"; else reason="Sync or candidate validation failed"; fi
          body="$reason

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Main was left unchanged. Resolve the integration in a reviewed PR."
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
          exit 1
